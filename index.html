  <body>
    <noscript>
      <div style="display:flex;align-items:center;justify-content:center;min-height:100vh;background:#0a0a0a;color:#fff;font-family:system-ui;text-align:center;padding:2rem">
        <p>Please enable JavaScript to use FitFusion.</p>
      </div>
    </noscript>
    <div id="root">
      <div class="ff-boot">
        <div class="ff-orb ff-orb-1"></div>
        <div class="ff-orb ff-orb-2"></div>
        <div class="ff-logo-wrap">
          <div class="ff-ring"></div>
          <div class="ff-ring ff-ring-2"></div>
          <div class="ff-logo">
            <svg viewBox="0 0 48 48" width="44" height="44" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
              <path d="M6 24h6l4-12 8 24 4-12h14"/>
            </svg>
          </div>
        </div>
        <p class="ff-title">FitFusion</p>
        <p class="ff-sub">Powering up your session…</p>
        <div class="ff-bar"><div class="ff-bar-fill"></div></div>
        <style>
          .ff-boot{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;background:radial-gradient(circle at 20% 10%,#1a1a3a 0%,#0a0a1f 60%,#050510 100%);overflow:hidden;font-family:system-ui,-apple-system,sans-serif}
          .ff-orb{position:absolute;border-radius:50%;filter:blur(60px);opacity:.6;animation:ff-float 6s ease-in-out infinite}
          .ff-orb-1{width:280px;height:280px;background:radial-gradient(circle,#8b5cf6,transparent);top:10%;left:-10%}
          .ff-orb-2{width:340px;height:340px;background:radial-gradient(circle,#ec4899,transparent);bottom:5%;right:-15%;animation-delay:-3s}
          .ff-logo-wrap{position:relative;width:120px;height:120px;display:flex;align-items:center;justify-content:center}
          .ff-ring{position:absolute;inset:0;border-radius:50%;border:2px solid transparent;border-top-color:#8b5cf6;border-right-color:#ec4899;animation:ff-spin 1.4s linear infinite}
          .ff-ring-2{inset:10px;border-top-color:#3b82f6;border-right-color:transparent;border-bottom-color:#10b981;animation:ff-spin 2s linear infinite reverse}
          .ff-logo{width:72px;height:72px;border-radius:22px;background:linear-gradient(135deg,#3b82f6,#8b5cf6,#ec4899);display:flex;align-items:center;justify-content:center;box-shadow:0 12px 40px rgba(139,92,246,.5),inset 0 1px 0 rgba(255,255,255,.3);animation:ff-pulse 2s ease-in-out infinite}
          .ff-title{margin:24px 0 4px;font-size:22px;font-weight:700;background:linear-gradient(135deg,#fff,#c4b5fd);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;letter-spacing:.5px}
          .ff-sub{margin:0;color:rgba(255,255,255,.5);font-size:13px}
          .ff-bar{margin-top:18px;width:180px;height:3px;border-radius:3px;background:rgba(255,255,255,.08);overflow:hidden}
          .ff-bar-fill{width:40%;height:100%;border-radius:3px;background:linear-gradient(90deg,#3b82f6,#8b5cf6,#ec4899);animation:ff-slide 1.6s ease-in-out infinite}
          @keyframes ff-spin{to{transform:rotate(360deg)}}
          @keyframes ff-pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
          @keyframes ff-float{0%,100%{transform:translate(0,0)}50%{transform:translate(20px,-20px)}}
          @keyframes ff-slide{0%{transform:translateX(-100%)}100%{transform:translateX(350%)}}
        </style>
      </div>
    </div>
