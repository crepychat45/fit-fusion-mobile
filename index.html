<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FitFusion - Your Ultimate Fitness Companion</title>
    <meta
      name="description"
      content="Transform your fitness journey with FitFusion. Track workouts, monitor progress, and achieve your health goals with our comprehensive fitness app."
    />
    <meta
      name="keywords"
      content="fitness, workout, health, exercise, tracking, mobile app, fitness companion"
    />
    <meta name="author" content="FitFusion Team" />
    <meta name="robots" content="index, follow" />

    <!-- Security Headers -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.gpteng.co https://dkblvejwqbwhyjsryqyr.supabase.co; style-src 'self' 'unsafe-inline'; img-src 'self' data: https: blob:; font-src 'self' data: https:; connect-src 'self' https: wss:; frame-src 'none'; object-src 'none'; base-uri 'self'; form-action 'self';"
    />
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta http-equiv="X-Frame-Options" content="DENY" />
    <meta http-equiv="X-XSS-Protection" content="1; mode=block" />
    <meta
      http-equiv="Referrer-Policy"
      content="strict-origin-when-cross-origin"
    />
    <meta
      http-equiv="Permissions-Policy"
      content="camera=(), microphone=(), geolocation=(), payment=()"
    />

    <!-- Performance Optimization -->
    <meta http-equiv="Cache-Control" content="public, max-age=31536000" />
    
    <!-- Critical preconnects for early connection establishment -->
    <link rel="preconnect" href="https://cdn.gpteng.co" crossorigin />
    <link rel="preconnect" href="https://dkblvejwqbwhyjsryqyr.supabase.co" crossorigin />
    
    <!-- DNS prefetch for non-critical origins -->
    <link rel="dns-prefetch" href="https://fonts.googleapis.com" />
    <link rel="dns-prefetch" href="https://images.unsplash.com" />
    <link rel="dns-prefetch" href="https://randomuser.me" />
    
    <!-- Critical CSS inline - Expanded for better FCP -->
    <style>
      /* Essential resets - minified */
      *{box-sizing:border-box;margin:0;padding:0}
      html,body{height:100%;margin:0}
      body{font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;line-height:1.5;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
      #root{min-height:100vh}
      
      /* Loading state - critical for FCP */
      .loading-fallback{display:flex;align-items:center;justify-content:center;min-height:100vh;font-size:1.125rem;color:#6366f1}
      
      /* Prevent CLS */
      img,svg,video{max-width:100%;height:auto;display:block}
      button{font:inherit;cursor:pointer;border:0;background:none}
      
      /* Critical layout utilities */
      .flex{display:flex}
      .hidden{display:none}
      
      /* Minimal background to avoid flash */
      body{background:#fff}
      @media (prefers-color-scheme:dark){
        body{background:#0a0a0a}
      }
    </style>
    
    <!-- Async CSS loading - non-blocking pattern -->
    <script>
      // Optimized CSS loader - loads CSS without blocking render
      (function(){
        var l=document.createElement('link');
        l.rel='preload';
        l.as='style';
        l.onload=function(){this.onload=null;this.rel='stylesheet'};
        // CSS will be injected by Vite build process
      })();
    </script>

    <!-- PWA Support -->
    <meta name="theme-color" content="#6366f1" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="FitFusion" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta
      property="og:title"
      content="FitFusion - Your Ultimate Fitness Companion"
    />
    <meta
      property="og:description"
      content="Transform your fitness journey with FitFusion. Track workouts, monitor progress, and achieve your health goals."
    />
    <meta
      property="og:image"
      content="https://images.unsplash.com/photo-1571019613454-1cb2f99b2d8b?w=1200&h=630&fit=crop"
    />
    <meta property="og:url" content="https://fitfusion.app" />
    <meta property="og:site_name" content="FitFusion" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="FitFusion - Your Ultimate Fitness Companion"
    />
    <meta
      name="twitter:description"
      content="Transform your fitness journey with FitFusion. Track workouts, monitor progress, and achieve your health goals."
    />
    <meta
      name="twitter:image"
      content="https://images.unsplash.com/photo-1571019613454-1cb2f99b2d8b?w=1200&h=630&fit=crop"
    />

    <!-- Favicon and Icons -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon.ico" />
  </head>

  <body>
    <noscript>
      <div style="padding: 2rem; text-align: center; font-family: system-ui, sans-serif;">
        <h1>JavaScript Required</h1>
        <p>FitFusion requires JavaScript to function properly. Please enable JavaScript in your browser settings.</p>
        <p>For the best experience, we recommend using the latest version of Chrome, Firefox, Safari, or Edge.</p>
      </div>
    </noscript>
    <div id="root">
      <div class="loading-fallback">
        <div>Loading FitFusion...</div>
      </div>
    </div>
    <!-- IMPORTANT: DO NOT REMOVE THIS SCRIPT TAG OR THIS VERY COMMENT! -->
    <script src="https://cdn.gpteng.co/gptengineer.js" type="module"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
