name: Build Android APK + AAB

on:
  push:
    branches: [main]
  workflow_dispatch:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: mobile-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Publish Android artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx4g"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.3

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-mobile-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-mobile-

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            android/.gradle
          key: ${{ runner.os }}-gradle-${{ hashFiles('android/**/*.gradle*', 'android/**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # ---------- DRY-RUN PREFLIGHT ----------
      - name: 🔍 Dry-run — Environment info
        run: |
          echo "::group::Toolchain versions"
          node --version
          bun --version
          java -version
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "::endgroup::"
          echo "::group::Repository lockfiles"
          ls -la bun.lock package.json capacitor.config.json
          test ! -f package-lock.json && echo "✅ no stale package-lock.json" || (echo "❌ package-lock.json present — Bun-only project" && exit 1)
          test ! -f yarn.lock && echo "✅ no stale yarn.lock" || (echo "❌ yarn.lock present — Bun-only project" && exit 1)
          echo "::endgroup::"

      - name: 🔍 Dry-run — Bun install (frozen lockfile)
        run: |
          echo "::group::bun install --frozen-lockfile"
          bun install --frozen-lockfile
          echo "✅ Bun install passed"
          echo "::endgroup::"

      - name: 🔍 Dry-run — TypeScript typecheck
        run: |
          echo "::group::tsc --noEmit"
          bunx tsc --noEmit
          echo "✅ Typecheck passed"
          echo "::endgroup::"

      - name: 🔍 Dry-run — Web build
        run: |
          echo "::group::bun run build"
          bun run build
          echo "✅ Web build passed"
          du -sh dist || true
          echo "::endgroup::"

      - name: 🔍 Dry-run — Capacitor add + sync Android
        run: |
          echo "::group::cap add/sync android"
          if [ ! -d "android" ]; then
            bunx cap add android
          fi
          bunx cap sync android
          echo "✅ Capacitor Android sync passed"
          echo "::endgroup::"

      - name: 🔍 Dry-run — Gradle wrapper validation
        working-directory: android
        run: |
          chmod +x ./gradlew
          echo "::group::gradlew tasks"
          ./gradlew tasks --no-daemon | head -40
          echo "::endgroup::"
          echo "✅ Gradle wrapper is functional"

      # ---------- ACTUAL BUILD ----------
      - name: Build Debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Build Release AAB
        working-directory: android
        run: ./gradlew bundleRelease --no-daemon --stacktrace
        continue-on-error: true

      - name: Collect artifacts
        run: |
          mkdir -p artifacts
          cp android/app/build/outputs/apk/debug/app-debug.apk artifacts/fitxfusion.apk || true
          cp android/app/build/outputs/bundle/release/app-release.aab artifacts/fitxfusion.aab || true
          ls -la artifacts

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-builds
          path: artifacts/*
          if-no-files-found: warn

      - name: Compute release tag
        id: tag
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: echo "tag=build-$(date +'%Y%m%d')-${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: FitXFusion ${{ steps.tag.outputs.tag }}
          generate_release_notes: true
          files: |
            artifacts/fitxfusion.apk
            artifacts/fitxfusion.aab
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
