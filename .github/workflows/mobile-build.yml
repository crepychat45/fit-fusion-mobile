name: Build Android APK + AAB

on:
  push:
    branches: [main]
  workflow_dispatch:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: mobile-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Publish Android artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx4g"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.3

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-mobile-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-mobile-

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            android/.gradle
          key: ${{ runner.os }}-gradle-${{ hashFiles('android/**/*.gradle*', 'android/**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # ---------- PREFLIGHT ----------
      - name: Environment info
        run: |
          node --version
          bun --version
          java -version
          echo "ANDROID_HOME=$ANDROID_HOME"
          if [ -f package-lock.json ] || [ -f yarn.lock ]; then
            echo "::error::Bun-only project — remove package-lock.json / yarn.lock"
            exit 1
          fi

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bunx tsc --noEmit

      - name: Web build
        run: |
          bun run build
          du -sh dist || true

      - name: Capacitor add + sync Android
        run: |
          if [ ! -d "android" ]; then
            bunx cap add android
          fi
          bunx cap sync android

      - name: Generate FitXFusion app icons & splash
        run: bun run cap:assets

      - name: Re-sync Android after branding
        run: bunx cap sync android

      # ---------- SIGNING ----------
      - name: Prepare release signing
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -e
          KS=android/app/fitxfusion-release.keystore
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$KS"
            STORE_PASS="$KEYSTORE_PASSWORD"; ALIAS="${KEY_ALIAS:-fitxfusion}"; KEY_PASS="${KEY_PASSWORD:-$KEYSTORE_PASSWORD}"
            echo "Using repository release keystore"
          else
            STORE_PASS="fitxfusion"; ALIAS="fitxfusion"; KEY_PASS="fitxfusion"
            keytool -genkeypair -v -keystore "$KS" -alias "$ALIAS" \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$STORE_PASS" -keypass "$KEY_PASS" \
              -dname "CN=FitXFusion, OU=Mobile, O=FitXFusion, L=NA, ST=NA, C=IN"
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret — generated a throwaway keystore (not Play-Store upload ready)"
          fi
          cat > android/keystore.properties <<EOF
          storeFile=fitxfusion-release.keystore
          storePassword=$STORE_PASS
          keyAlias=$ALIAS
          keyPassword=$KEY_PASS
          EOF

      - name: Wire signing config into Gradle
        run: |
          python3 - <<'PY'
          import re, pathlib
          p = pathlib.Path("android/app/build.gradle")
          s = p.read_text()
          if "fitxfusionSigning" not in s:
              props = '''
def keystorePropsFile = rootProject.file("keystore.properties")
def keystoreProps = new Properties()
if (keystorePropsFile.exists()) { keystoreProps.load(new FileInputStream(keystorePropsFile)) }
'''
              s = props + s
              signing = '''    signingConfigs {
        fitxfusionSigning {
            if (keystorePropsFile.exists()) {
                storeFile file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
            }
        }
    }
'''
              s = re.sub(r'android \{\n', 'android {\n' + signing, s, count=1)
              s = re.sub(r'(buildTypes \{\s*\n\s*release \{\n)',
                         r'\1            signingConfig signingConfigs.fitxfusionSigning\n', s, count=1)
              p.write_text(s)
              print("signing config injected")
          else:
              print("signing config already present")
          PY
          grep -n "fitxfusionSigning" android/app/build.gradle

      # ---------- BUILD ----------
      - name: Gradle wrapper check
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew --version

      - name: Build Debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Build Release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Build Release AAB
        working-directory: android
        run: ./gradlew bundleRelease --no-daemon --stacktrace

      - name: Collect artifacts
        run: |
          mkdir -p artifacts
          cp android/app/build/outputs/apk/debug/app-debug.apk artifacts/fitxfusion-debug.apk || true
          cp android/app/build/outputs/apk/release/app-release.apk artifacts/fitxfusion.apk || true
          cp android/app/build/outputs/bundle/release/app-release.aab artifacts/fitxfusion.aab || true
          ls -la artifacts
          test -s artifacts/fitxfusion.apk || test -s artifacts/fitxfusion-debug.apk

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-builds
          path: artifacts/*
          if-no-files-found: error

      - name: Compute release tag
        id: tag
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: echo "tag=build-$(date +'%Y%m%d')-${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: FitXFusion ${{ steps.tag.outputs.tag }}
          generate_release_notes: true
          files: |
            artifacts/fitxfusion-debug.apk
            artifacts/fitxfusion.apk
            artifacts/fitxfusion.aab
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
