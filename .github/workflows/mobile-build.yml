name: Build Android APK + AAB

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mobile-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Publish Android artifacts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.3

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-mobile-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-mobile-

      - name: Install dependencies
        run: bun install --frozen-lockfile || bun install

      - name: Build web bundle
        run: bun run build

      - name: Add Android platform
        run: |
          if [ ! -d "android" ]; then
            bunx cap add android
          fi
          bunx cap sync android

      - name: Grant Gradle permission
        working-directory: android
        run: chmod +x ./gradlew

      - name: Build Debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Build Release AAB
        working-directory: android
        run: ./gradlew bundleRelease --no-daemon
        continue-on-error: true

      - name: Collect artifacts
        run: |
          mkdir -p artifacts
          cp android/app/build/outputs/apk/debug/app-debug.apk artifacts/fitxfusion.apk || true
          cp android/app/build/outputs/bundle/release/app-release.aab artifacts/fitxfusion.aab || true
          ls -la artifacts

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-builds
          path: artifacts/*
          if-no-files-found: warn

      - name: Compute release tag
        id: tag
        run: echo "tag=build-$(date +'%Y%m%d')-${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: FitXFusion ${{ steps.tag.outputs.tag }}
          generate_release_notes: true
          files: |
            artifacts/fitxfusion.apk
            artifacts/fitxfusion.aab
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
