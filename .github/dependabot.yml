# Dependabot configuration for automated dependency updates.
# Full docs: https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/" # Root directory for package.json
    schedule:
      interval: "weekly" # Checks for updates every week
    open-pull-requests-limit: 10 # Maximum number of open PRs
    allow:
      - dependency-type: "direct"
      - dependency-type: "indirect"
    ignore:
      # Ignore only major version updates (to avoid breaking changes PRs)
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "fix(deps):"
      include: "scope"

# If you use other ecosystems, add more entries under `updates`.
# Example for GitHub Actions:
#  - package-ecosystem: "github-actions"
#    directory: "/"
#    schedule:
#      interval: "weekly"
